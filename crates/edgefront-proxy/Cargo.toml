[package]
name = "edgefront-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Routing and load balancing for the edgefront proxy."
publish = false

[dependencies]
edgefront-core.workspace = true

bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "route"
harness = false

[[bench]]
name = "balancer"
harness = false

[lints]
workspace = true
