# libpacer's bench/bench_proxy.c as a scenario: a 4 GiB download on one
# connection, 50,000 sequential 64-byte round trips (p50 and p99), and 32
# connections of 5,000 round trips each, direct and through each proxy
# with no limits set. `edgefront-bench l4 --scenario THIS [--pacerd BIN]
# [--edgefront BIN]`.
name = "l4-proxy"
bulk_bytes = 4294967296
round_trips = 50000
concurrent_clients = 32
concurrent_trips = 5000
runs = 5
