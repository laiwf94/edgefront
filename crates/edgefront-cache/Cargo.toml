[package]
name = "edgefront-cache"
description = "The edgefront cache engine: HTTP caching policy, storage and purge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["compression"]
# gzip, brotli and zstd variants of stored responses, and RFC 9842's
# dictionary-compressed dcb and dcz. Without it every response is stored and
# served as the origin sent it.
compression = ["dep:brotli", "dep:flate2", "dep:zstd"]

[dependencies]
edgefront-core.workspace = true

brotli = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

bytes.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
edgefront-proxy.workspace = true
proptest.workspace = true
toml.workspace = true

[lints]
workspace = true
