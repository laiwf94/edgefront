[package]
name = "edgefront-limiter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Lock-free rate limiting primitives for edgefront, ported from libpacer."
publish = false

[features]
default = ["http", "service"]
# The HTTP limiter layer for the proxy pipeline (`http` module). Without it
# the crate is the algorithms alone, depending only on serde.
http = ["dep:edgefront-core", "dep:edgefront-proxy", "dep:http", "dep:tokio", "dep:tracing"]
# The decision service (`service` module): the Envoy rate limit service API's
# messages, generated from proto/ into src/service/proto/, and its gRPC
# service on tonic's framing.
service = ["dep:http", "dep:prost", "dep:tonic"]

[dependencies]
serde.workspace = true
edgefront-core = { workspace = true, optional = true }
edgefront-proxy = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
criterion.workspace = true
prost-build.workspace = true
protox.workspace = true
toml = { workspace = true, features = ["display"] }
tonic = { workspace = true, features = ["transport"] }

[[test]]
name = "rls"
required-features = ["http", "service"]

[[bench]]
name = "decisions"
harness = false

[[bench]]
name = "prefix_list"
harness = false

[[bench]]
name = "http_layer"
harness = false
required-features = ["http"]

[lints]
workspace = true

[[bench]]
name = "penalty"
harness = false

[[bench]]
name = "replay"
harness = false
required-features = ["http"]
