# A single node in front of the example origin. Every field below the
# origins is optional; the values shown are the defaults unless noted.
node_id = "edge-1"
listen = "127.0.0.1:8080"
admin_listen = "127.0.0.1:9090"

[[origins]]
name = "primary"
url = "http://127.0.0.1:9100"

# A second origin is used when the first is down.
# [[origins]]
# name = "secondary"
# url = "http://127.0.0.1:9101"

[cache]
memory_bytes = 268435456      # 256 MiB
max_object_bytes = 8388608    # 8 MiB; larger responses stream through uncached
shards = 16
max_variants = 8              # stored variants per URL when the origin sends Vary
heuristic_max_secs = 86400    # cap on freshness guessed from Last-Modified

# Not a default: the disk tier is off unless this section is present.
# [cache.disk]
# path = "/var/cache/cachet"
# max_bytes = 10737418240

[health]
path = "/healthz"
interval_ms = 2000
timeout_ms = 1000
rise = 2
fall = 3

[timeouts]
connect_ms = 1000
response_ms = 10000
body_ms = 30000
client_header_ms = 10000
shutdown_ms = 10000

[limits]
max_uri_bytes = 8192
max_request_body_bytes = 10485760
max_header_bytes = 65536

# Peers receive purges from this node. Needs CACHET_CLUSTER_SECRET.
# [[peers]]
# name = "edge-2"
# url = "http://10.0.0.2:9090"

[gossip]
max_age_secs = 600
retry_max_ms = 5000
request_timeout_ms = 2000
queue = 1024
