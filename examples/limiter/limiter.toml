# The limiter section of an edgefront config. Field names are pacerd's
# directive names, so `web` below is pacer's examples/pacerd.conf as it
# reads here. Rates also take fractions and periods up to days, and a
# listener can cap new connections per client over a long window with
# per_ip_conn_quota. `edgefront check` lints this file; `edgefront check
# --print` writes any limiter config, pacerd.conf included, in this form.
workers = 2
admin_socket = "/run/edgefront/limiter.sock"

[[listeners]]
name = "web"
listen = "0.0.0.0:8080"
upstream = "127.0.0.1:9000"
max_conns = 10000
bandwidth = "100m/s burst 1m"
per_ip_max_conns = 20
per_ip_conn_rate = "10/s burst 20"
per_ip_bandwidth = "1m/s burst 256k"
min_rate = "512 per 10s"
table_size = 65536

# A public API: each client may open one connection every two seconds
# with bursts of 30, and at most 10,000 in any day.
[[listeners]]
name = "api"
listen = "0.0.0.0:8443"
upstream = "127.0.0.1:9443"
max_conns = 4096
per_ip_max_conns = 16
per_ip_conn_rate = "0.5/s burst 30"
per_ip_conn_quota = "10000/day"
per_ip_bandwidth = "2.5m/s burst 512k"
table_size = 65536

# Nightly batch uploads: 90 new connections a minute per client, at most
# 1,500 in any six hours, and the whole listener held to 40 MiB/s.
[[listeners]]
name = "batch"
listen = "0.0.0.0:9100"
upstream = "127.0.0.1:9101"
max_conns = 512
per_ip_conn_rate = "90/min"
per_ip_conn_quota = "1500/6h"
bandwidth = "40m/s burst 4m"
table_size = 4096
