# Half the requests miss: the fill path, request collapsing and the cost of
# admitting objects asked for once. Measures what a target adds in front of
# an origin when the cache helps least.
name = "miss-heavy"
description = "50,000 objects of 4 to 64 KiB under a Zipf 0.8 law, 50% hits at 3,000 requests per second."
protocol = "http1"
connections = 128
timeout = "10s"
seed = 4

[warmup]
rate = 3000
duration = "20s"

[load]
rate = 3000
duration = "60s"

[keys]
count = 50000
zipf = 0.8
hit_ratio = 0.5

[[objects]]
size = "4KiB"
weight = 3

[[objects]]
size = "16KiB"
weight = 2

[[objects]]
size = "64KiB"
weight = 1
