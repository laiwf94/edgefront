# steer against edgefront proxy: cleartext HTTP/1.1 through the proxy to the origin
# over 10000 keep-alive connections, at a constant 20,000 requests per second.
name = "steer-port-http1-10000"
description = "cleartext HTTP/1.1 to the origin through the proxy over 10000 connections, 20,000 requests per second of 1 KiB objects."
protocol = "http1"
connections = 10000
timeout = "5s"
seed = 1

[warmup]
rate = 10000
duration = "5s"

[load]
rate = 20000
duration = "30s"

# The proxy caches nothing, so every request reaches the origin; the keys
# only spread the requests over distinct paths.
[keys]
count = 1000
zipf = 1.0
hit_ratio = 0.9

[[objects]]
size = "1KiB"
