# steer against edgefront proxy: HTTP/1.1 over TLS 1.3 over 64 connections, stepped from
# 20,000 to 120,000 requests per second, to find the rate each sustains.
name = "steer-port-tls-64-ramp"
description = "HTTP/1.1 over TLS 1.3 to the origin through the proxy over 64 connections, from 20,000 to 120,000 requests per second in six 10-second steps."
protocol = "http1"
connections = 64
timeout = "5s"
seed = 1

[warmup]
rate = 10000
duration = "5s"

[load]
start = 20000
step = 20000
steps = 6
step_duration = "10s"

# The proxy caches nothing, so every request reaches the origin.
[keys]
count = 1000
zipf = 1.0
hit_ratio = 0.9

[[objects]]
size = "1KiB"

[tls]
server_name = "api.example.com"
