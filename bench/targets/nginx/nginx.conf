# One worker per CPU, keep-alive to the origin, and proxy_cache honouring
# the origin's Cache-Control (no proxy_cache_valid override). proxy_cache_lock
# collapses concurrent misses, as the other caches do by default.
worker_processes {{cpus}};
worker_rlimit_nofile 65536;
error_log stderr warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench levels=1:2 keys_zone=bench:64m max_size={{cache_mib}}m inactive=2h use_temp_path=off;

    upstream origin {
        server {{origin}};
        keepalive 256;
    }

    server {
        listen {{port}} reuseport;
        keepalive_requests 1000000;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache bench;
            proxy_cache_lock on;
        }
    }
}
