# One thread per CPU, connection reuse to the origin, and the cache
# honouring the origin's Cache-Control up to an hour. HAProxy's cache is
# capped at 4095 MB and objects at half of it.
global
    nbthread {{cpus}}
    # Two descriptors a connection: within the runner's 65,536.
    maxconn 30000

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    http-reuse always

cache bench
    total-max-size {{cache_mib}}
    max-object-size {{max_object_bytes}}
    max-age 3600

frontend bench
    bind :{{port}}
    default_backend origin

backend origin
    http-request cache-use bench
    http-response cache-store bench
    server origin {{origin}}
