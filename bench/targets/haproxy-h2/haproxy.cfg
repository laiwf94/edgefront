# One thread per CPU, up to 1,000 concurrent streams a connection on each
# side, HTTP/2 to the origin with connections shared between streams, and
# no cache.
global
    nbthread {{cpus}}
    # Two descriptors a connection: within the runner's 65,536.
    maxconn 30000
    tune.h2.fe.max-concurrent-streams 1000
    tune.h2.be.max-concurrent-streams 1000

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    http-reuse always

frontend bench
    bind :{{port}}
    default_backend origin

backend origin
    server origin {{origin}} proto h2
