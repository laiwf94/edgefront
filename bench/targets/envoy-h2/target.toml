# Envoy as an HTTP/2 proxy with no cache: prior-knowledge HTTP/2 or
# HTTP/1.1 from the load generator (codec AUTO) and HTTP/2 to the origin.
# The proxy track's HTTP/2 and gRPC comparison
# (crates/edgefront-bench/scenarios/h2_grpc.toml).
product = "Envoy"
version = "1.39.6"
kind = "proxy"
track = "proxy"
image = "envoyproxy/envoy:v1.39.6@sha256:1fde8efee875e4e4f6a39a90fe49d9338e1caacce5762034ef9fb4bbb9ad6aed"
port = 10000
command = ["envoy", "-c", "/etc/envoy/envoy.yaml", "--concurrency", "{{cpus}}", "-l", "warn"]

[files]
"/etc/envoy/envoy.yaml" = "envoy.yaml"
