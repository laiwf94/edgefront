# The benchmark regression gate (crates/edgefront-bench/src/gate.rs), run on
# pull requests by .github/workflows/bench.yml.
#
# Each pull request runs `scenario` against `target` `runs` times on a
# GitHub-hosted runner and compares each metric with the same scenario run
# as many times on its base commit, alternating on the same runner (or, on
# a model in committed_models, with the committed `baseline`, recorded from
# `baseline_commit`). A metric fails when a one-sided Mann-Whitney U test
# gives p < p_value AND its median is worse by more than its tolerance.
# Sizes have fixed ceilings.
scenario = "bench/ci/gate.toml"
target = "edgefront"
target_cpus = 1
# Ten a side, not the five the gate started with or the nine after it:
# see "Runs per side" below.
runs = 10
p_value = 0.01
baseline = "bench/baseline/gate.json"
baseline_commit = "0f4230eb560a25a1e5e06d27b6a9d206d949de1b"
# CPU models whose committed samples are steady enough to judge against:
# none, by the measurements below.
committed_models = []

# How it was calibrated, on GitHub's hosted runners, 19 and 20 Nov 2026, with
# edgefront as at baseline_commit:
#
# - Committed samples. 18 runs of five on unchanged code. For each run, its
#   median against the pooled median of the other runs on the same CPU model,
#   worse direction:
#     AMD EPYC 7763 (6 runs)   p99 -4.9 to +2.2%   requests per CPU s -3.0 to +3.2%
#     AMD EPYC 9V74 (10 runs)  p99 -17.8 to +27.2% requests per CPU s -6.7 to +18.5%
#   plus one run each on an EPYC 9V45 and a Xeon 8573C. The models differ by up
#   to 60% from each other, so samples are kept per model. On the 9V74 an
#   unchanged run failed the gate at p99 +23.3%, requests per CPU s +6.1%; and
#   with the 7763 judged against its committed samples, an unchanged run
#   failed at p99 +6.8% (p = 0.0077). Committed samples are too noisy on
#   every model, so committed_models is empty and bench/baseline/gate.json is
#   the record of these runs, not what a pull request is judged against.
# - Same runner. So the gate built baseline_commit and
#   alternated five of its runs with five of the candidate's. Four unchanged
#   runs of that (Xeon 6973P, EPYC 7763, two EPYC 9V74) differed by p99 -1.5 to
#   +2.2% and requests per CPU s -7.6 to +0.8%, none of them significant (lowest
#   p = 0.21), and all passed.
#
# The tolerances are the issue's 5%: a change fails only when it is both
# significant and over 5%, and the measured noise did neither at once.
#
# Runs per side. With five a side the exact test cannot go below p = 1/252,
# and p < 0.01 needs 24 of the 25 candidate-baseline pairs worse, so one
# run a noisy neighbour spoils hides a real regression. A branch spinning
# 3 us per hit failed only two of three tries that way: 11.8% and 7.9%
# worse at p = 0.004, then 8.6% worse at p = 0.016 (#87). With nine a side
# p < 0.01 needs 67 of 81 pairs, so up to 14 may go the wrong way; the
# job takes about ten minutes instead of six. The proxy's p99 gate runs
# nine a side for the same reason. The runs alternate, the first side
# swapping every round, so a steady drift in the runner favours neither.
# The comparison is with the change's own base commit, not baseline_commit,
# so a pull request answers for its own diff and not for everything merged
# since the gate was set. First proof at nine (bench runs 80-85): three
# unchanged runs passed both metrics (largest change 1.9%); the 3 us plant
# measured 7.1% (p < 0.0001, failed), 3.1% (p = 0.0071, under 5%) and 7.8%
# (p = 0.020, passed), so the proof still needs a plant that costs a
# measured 10% (docs/DESIGN.md). Ten a side from 20 Nov 2026 (the owner's
# choice of "10+10 runs" in #87): p < 0.01 then needs 81 of 100 pairs, so
# up to 19 may go the wrong way, at about a minute more per job.

# Response-time p99 at a fixed 2,000 requests per second.
[metrics.p99_ms]
better = "lower"
tolerance = 0.05

# Completed requests per second of edgefront's CPU time: the throughput
# one CPU buys, which falls when the hit path gets slower.
[metrics.requests_per_cpu_second]
better = "higher"
tolerance = 0.05

# Fixed ceilings, about 10% above the sizes on 20 Nov 2026 (x86_64 release
# build on the runner): the binary was 7,905,712 bytes and the image
# 13,807,092. Raising one is a decision a pull request states.
#
# binary_bytes raised in #255 (the legacy/pacer deletion, the first pull
# request the gate judged after the commits below went to main): the
# binary was 9,228,328 bytes on the runner. The week's growth, measured on
# an arm64 release build: `edgefront limits` and `edgefront ctl limits`
# (pacerd's data path, its admin API and client, #85 and #88) added about
# 0.65 MB, and the proxy's TLS listener and upstream TLS (#86) about 0.54
# MB. The new ceiling is again about 10% above.
#
# binary_bytes raised again in #257: main's binary was 10,409,136 bytes on
# the runner (at 3069b36), 2.6% over the ceiling above, so every pull
# request failed the gate on size whatever it changed. Measured on the
# runner (x86_64, the gate's own release build) at each commit that grew
# it since the 9,228,328 the last raise was set from (5a4646e), by the
# throwaway size-probe workflow of 20 Nov 2026 (Actions run 44761791868):
#
#   +686,920  ACME in edgefront proxy (32a6b0d, #89): the client and
#             challenge responders of a921814 and f6be2bf were linked in
#             only once the renewal loop used them
#   +212,000  address policy in edgefront limits (d1e5769, #91): the CIDR
#             tree, classes and trusted-proxy walk of d6a79e8 to c327675
#             were linked in once the limiter config read them
#   +123,296  slice caching (6466daf, #90)
#    +71,224  the segment store (e2339bf, #90)
#    +48,152  streaming fill (298fe3c, #90)
#    +28,464  f78566c to 507b874, not split further (the slice reader fix)
#    +14,920  multi-range responses (c40626f, #90)
#     +9,328  index snapshot loading (04ff789, #90)
#    -13,496  a921814 and f6be2bf before their code was linked in
#
# 1,180,808 bytes in all, and a ceiling of 11,450,000 was set from it. ACME
# is the largest part; putting it behind a cargo feature would take back
# about 0.69 MB if a smaller default binary is ever wanted.
#
# The same day the HTTP/2 and HTTP limits work reached main, and the ten-run
# proof's unchanged branches (bench runs 105-107, at 34bea7b) failed both
# ceilings: the binary was 13,358,992 bytes and the image 15,702,944. The
# second size probe (Actions run 44769371778), from 3069b36 to f2af81c:
#
#   +2,404,200  HTTP/2 on the edge listener (282d224, #92): the h2 crate
#     +293,272  upstream protocol choice and ALPN (c22e00a, #92)
#     +241,208  HTTP limits in edgefront_limiter::http (8a9963f, #94)
#      +67,896  upstream HTTP/2 windows from the bandwidth-delay product
#               (f2af81c, #92)
#      +11,208  gRPC over HTTP/2 (31a19a9, #92)
#          -32  the upstream HTTP/2 pool (fc553a1, #92)
#
# 3,017,752 bytes, to 13,426,888 at f2af81c. Both ceilings are again about
# 10% above: the binary's above f2af81c's, the image's above the 15,702,944
# measured at 34bea7b. The roadmap's image target, under 20 MB, still holds.
[ceilings]
binary_bytes = 14770000
image_bytes = 17270000
