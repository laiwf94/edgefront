name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/edgefront-cache/fuzz
            crates/edgefront-core/fuzz
            crates/edgefront-limiter/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # crates/edgefront/tests/difftest_cache.rs runs nodes on a logical clock.
      - name: Install libfaketime
        run: sudo apt-get update -q && sudo apt-get install -y -q libfaketime
      # The same three steps as `make check`.
      - name: Format
        run: make fmt
      - name: Clippy
        run: make lint
      - name: Tests with coverage (lines >= 90% in every crate)
        run: make cov
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  difftest-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libfaketime
        run: sudo apt-get update -q && sudo apt-get install -y -q libfaketime
      - name: Diff 50,000 requests against cachet 0.1
        run: make difftest-cache

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared rust-version
        run: cargo check --locked --workspace --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # cargo deny on the workspace and each fuzz crate, cargo audit on every
      # lockfile, and the direct dependency budget.
      - name: Audit
        run: make audit

  fuzz:
    name: fuzz (${{ matrix.crate }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    # A target runs for `secs` seconds (default 600); `timeout` minutes
    # (default 30) leave room for the build.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: edgefront-cache, target: cache_control }
          - { crate: edgefront-cache, target: entity_tags }
          - { crate: edgefront-cache, target: range }
          - { crate: edgefront-cache, target: http_date }
          - { crate: edgefront-cache, target: disk_record }
          - { crate: edgefront-cache, target: purge_messages }
          - { crate: edgefront-core, target: request_id }
          - { crate: edgefront-core, target: base_url }
          - { crate: edgefront-core, target: bearer_token }
          - { crate: edgefront-limiter, target: limiter_config, secs: 1800, timeout: 50 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where the sanitizers cannot link; name the gnu target.
      # With the target's dictionary when it has one. An input that takes
      # over 10 seconds fails the run, so a parse that loops is caught.
      - name: Fuzz for ${{ matrix.secs || 600 }} seconds
        run: |
          dir=crates/${{ matrix.crate }}/fuzz
          dict=
          if [ -f "$dir/${{ matrix.target }}.dict" ]; then dict="-dict=$dir/${{ matrix.target }}.dict"; fi
          cargo fuzz run --fuzz-dir "$dir" ${{ matrix.target }} --target x86_64-unknown-linux-gnu \
            -- -max_total_time=${{ matrix.secs || 600 }} -timeout=10 $dict
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore

  # One ThreadSanitizer job per crate, from the Makefile's list.
  tsan-crates:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "crates=$(make -s tsan-crates | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

  thread-sanitizer:
    name: thread-sanitizer (${{ matrix.crate }})
    needs: tsan-crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.tsan-crates.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Unit and concurrency tests under ThreadSanitizer
        run: make tsan-${{ matrix.crate }} TSAN_CARGO=cargo

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live demo against the edgefront binary
        run: examples/demo.sh
      - name: Live demo against the reference cachet binary
        run: DEMO_BIN=cachet examples/demo.sh
      - name: Limiter config demo
        run: examples/limiter_config.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cachet .
      - name: Runs as non-root
        run: |
          test "$(docker image inspect cachet --format '{{.Config.User}}')" = "nonroot:nonroot"
          docker run --rm cachet --version
