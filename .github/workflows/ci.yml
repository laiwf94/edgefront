name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/edgefront-cache/fuzz
            crates/edgefront-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The same three steps as `make check`.
      - name: Format
        run: make fmt
      - name: Clippy
        run: make lint
      - name: Tests with coverage (lines >= 90%)
        run: make cov
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared rust-version
        run: cargo check --locked --workspace --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
      - name: Audit the fuzz crates
        run: |
          cargo audit --file crates/edgefront-cache/fuzz/Cargo.lock
          cargo audit --file crates/edgefront-core/fuzz/Cargo.lock

  fuzz:
    name: fuzz (${{ matrix.crate }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: edgefront-cache, target: cache_control }
          - { crate: edgefront-cache, target: entity_tags }
          - { crate: edgefront-cache, target: range }
          - { crate: edgefront-cache, target: http_date }
          - { crate: edgefront-cache, target: disk_record }
          - { crate: edgefront-cache, target: purge_messages }
          - { crate: edgefront-core, target: request_id }
          - { crate: edgefront-core, target: base_url }
          - { crate: edgefront-core, target: bearer_token }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where the sanitizers cannot link; name the gnu target.
      - name: Fuzz for 10 minutes
        run: >
          cargo fuzz run --fuzz-dir crates/${{ matrix.crate }}/fuzz
          ${{ matrix.target }} --target x86_64-unknown-linux-gnu
          -- -max_total_time=600
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Concurrency tests under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/tsan-suppressions.txt
        run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --lib --test proxy --test revalidation --test failure --test cluster

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live demo against the release binary
        run: examples/demo.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cachet .
      - name: Runs as non-root
        run: |
          test "$(docker image inspect cachet --format '{{.Config.User}}')" = "nonroot:nonroot"
          docker run --rm cachet --version
