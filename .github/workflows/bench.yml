name: bench

# The benchmark harness on a Linux host. It runs only when something it
# measures or is made of changes, to keep GitHub minutes for the rest.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "bench/**"
      - "Cargo.lock"
      - "examples/bench.sh"
      - "scripts/check-p99-gate.py"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "bench/**"
      - "Cargo.lock"
      - "examples/bench.sh"
      - "scripts/check-p99-gate.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      record:
        description: "Also write a gate baseline from this run (uploaded as an artifact)"
        type: boolean
        default: false
      measure:
        description: "Run the baseline commit beside the candidate whatever the CPU model"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The runner uses the images built below under their :local tags.
  EDGEFRONT_BENCH_TAG: local

jobs:
  harness:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build edgefront and the harness
        run: cargo build --release --locked --bin edgefront --bin edgefront-bench
      # The segment store's warm restart, timed: a million objects from the
      # index snapshot in under a second. Only a release build is held to it.
      - name: Warm restart of a million objects
        run: cargo test --release --locked -p edgefront-cache --test segment_restart -- --nocapture
      # The images from the binaries just built (bench/Dockerfile.prebuilt),
      # under the tags the runner uses, so it builds nothing itself.
      - name: Build the benchmark images
        run: |
          mkdir -p target/bench-images
          cp target/release/edgefront target/release/edgefront-bench target/bench-images/
          docker build -f bench/Dockerfile.prebuilt --target harness -t edgefront-bench/harness:local target/bench-images
          docker build -f bench/Dockerfile.prebuilt --target edgefront -t edgefront-bench/edgefront:local target/bench-images
      # Every target, pinned to its CPUs on the runner's cgroup v2 (systemd
      # driver), for ten seconds each: the containers start, answer, cache,
      # and are measured.
      - name: Smoke run against every target
        run: |
          target/release/edgefront-bench run --scenario bench/ci/smoke.toml \
            --targets edgefront,varnish,nginx,haproxy,envoy,ats,envoy-ratelimit \
            --target-cpus 2 --out target/bench/smoke --run smoke
      # An independent, complete JSON Schema validator over the results, on
      # top of the harness's own check before it writes each one.
      - name: Results match bench/schema/result.schema.json
        run: pipx run check-jsonschema==0.38.2 --schemafile bench/schema/result.schema.json target/bench/smoke/smoke/*.json
      - name: Every request answered
        run: |
          for f in target/bench/smoke/smoke/*.json; do
            jq -e '.measured.completed == .measured.scheduled and (.measured.errors | [.[]] | add) == 0' "$f" >/dev/null \
              || { echo "$f:"; jq .measured "$f"; exit 1; }
          done
          cat target/bench/smoke/report.md >> "$GITHUB_STEP_SUMMARY"

  # The regression gate (bench/gates.toml): the gate scenario five times
  # against edgefront on one CPU, judged with a Mann-Whitney U test and the
  # measured tolerances. On a CPU model whose committed samples are steady
  # enough (committed_models), against those; on any other, against the
  # baseline's commit built and run here, interleaved with the candidate.
  # Pull requests and manual runs only: about four minutes, seven when the
  # baseline is measured too.
  gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build edgefront and the harness
        run: cargo build --release --locked --bin edgefront --bin edgefront-bench
      - name: Build the benchmark images
        run: |
          mkdir -p target/bench-images
          cp target/release/edgefront target/release/edgefront-bench target/bench-images/
          docker build -f bench/Dockerfile.prebuilt --target harness -t edgefront-bench/harness:local target/bench-images
          docker build -f bench/Dockerfile.prebuilt --target edgefront -t edgefront-bench/edgefront:local target/bench-images
      - name: Choose how to judge this runner
        run: |
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)
          echo "CPU_MODEL=$cpu" >> "$GITHUB_ENV"
          read -r plan commit <<<"$(target/bench-images/edgefront-bench gate --config bench/gates.toml --machine "$cpu" --plan)"
          [[ "${{ inputs.measure }}" == true ]] && plan=measure
          [[ "${{ inputs.record }}" == true ]] && plan=committed
          echo "PLAN=$plan" >> "$GITHUB_ENV"
          echo "BASE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "$cpu: $plan $commit"
      # The baseline's commit, built in the same target directory (the
      # dependencies are reused; the candidate's binaries are copied out)
      # and imaged as a second target, edgefront-base.
      - name: Build the baseline commit
        if: env.PLAN == 'measure'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          git worktree add target/baseline-src FETCH_HEAD
          (cd target/baseline-src && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --locked --bin edgefront)
          mkdir -p target/baseline-images
          cp target/release/edgefront target/baseline-images/
          docker build -f bench/Dockerfile.prebuilt --target edgefront -t edgefront-bench/edgefront-base:local target/baseline-images
      - name: Five gate runs
        run: |
          mkdir -p target/bench-targets
          cp -r bench/targets/edgefront target/bench-targets/
          targets=edgefront
          if [[ $PLAN == measure ]]; then
            cp -r bench/targets/edgefront target/bench-targets/edgefront-base
            sed -i 's|edgefront-bench/edgefront:local|edgefront-bench/edgefront-base:local|' target/bench-targets/edgefront-base/target.toml
            targets=edgefront,edgefront-base
          fi
          # With two targets, --repeat alternates them run by run.
          target/bench-images/edgefront-bench run --scenario bench/ci/gate.toml --targets "$targets" \
            --targets-dir target/bench-targets --target-cpus 1 --repeat 5 --out target/bench/gate --run gate
      - name: Record a baseline
        if: inputs.record
        run: |
          cp bench/baseline/gate.json target/bench/gate-baseline.json
          target/bench-images/edgefront-bench baseline --config bench/gates.toml --results target/bench/gate \
            --machine "$CPU_MODEL" --commit "$(git rev-parse HEAD)" --out target/bench/gate-baseline.json
          echo "$CPU_MODEL, binary $(stat -c %s target/bench-images/edgefront) bytes"
      - name: Judge
        if: ${{ !inputs.record }}
        run: |
          baseline=bench/baseline/gate.json
          if [[ $PLAN == measure ]]; then
            baseline=target/bench/gate-baseline.json
            target/bench-images/edgefront-bench baseline --config bench/gates.toml --results target/bench/gate \
              --target edgefront-base --machine "$CPU_MODEL" --commit "$BASE_COMMIT" --out "$baseline"
          fi
          target/bench-images/edgefront-bench gate --config bench/gates.toml --results target/bench/gate \
            --baseline "$baseline" --machine "$CPU_MODEL" --binary target/bench-images/edgefront \
            --verdict target/bench/gate-verdict.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-gate
          path: |
            target/bench/gate
            target/bench/gate-baseline.json
            target/bench/gate-verdict.json

  # The proxy's p99 regression gate (#86): edgefront proxy at this commit
  # against itself at the parent commit, on the same runner, in five
  # alternating repetitions of bench/ci/steer-port-gate.toml. It fails when
  # the median p99 is more than 5% above the parent's
  # (scripts/check-p99-gate.py). Comparing two builds on one machine, rather
  # than against numbers from another, is what makes 5% meaningful on a
  # shared runner.
  proxy-p99-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build this commit
        run: cargo build --release --locked --bin edgefront --bin edgefront-bench
      - name: Build the parent commit
        run: |
          git worktree add "$RUNNER_TEMP/parent" HEAD^
          cargo build --release --locked --bin edgefront \
            --manifest-path "$RUNNER_TEMP/parent/Cargo.toml" --target-dir target/parent
      # The runner takes edgefront-bench/edgefront:local, so each side is
      # tagged :local in turn before its run.
      - name: Build the images
        run: |
          mkdir -p target/bench-images target/parent-images
          cp target/release/edgefront target/release/edgefront-bench target/bench-images/
          cp target/parent/release/edgefront target/release/edgefront-bench target/parent-images/
          docker build -f bench/Dockerfile.prebuilt --target harness -t edgefront-bench/harness:local target/bench-images
          docker build -f bench/Dockerfile.prebuilt --target edgefront -t edgefront-bench/edgefront:this target/bench-images
          docker build -f bench/Dockerfile.prebuilt --target edgefront -t edgefront-bench/edgefront:parent target/parent-images
      - name: Five alternating repetitions
        run: |
          side() {
            docker tag "edgefront-bench/edgefront:$1" edgefront-bench/edgefront:local
            target/release/edgefront-bench run --scenario bench/ci/steer-port-gate.toml \
              --targets edgefront-proxy --target-cpus 1 \
              --out "target/bench-gate/run$2/$1" --run "gate$2-$1"
          }
          for i in 1 2 3 4 5; do
            if (( i % 2 )); then side parent "$i"; side this "$i"; else side this "$i"; side parent "$i"; fi
          done
      - name: Median p99 within 5% of the parent's
        run: |
          set -o pipefail
          scripts/check-p99-gate.py 0.05 target/bench-gate/run* | tee -a "$GITHUB_STEP_SUMMARY"
