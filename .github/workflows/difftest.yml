name: difftest

# Every differential suite against steer, as one job: the configuration
# and routing diff (10,000 configs and 100,000 requests), the balancer diff
# (1,000 scenarios of 10,000 picks), the resilience diff (5,000 outlier and
# 5,000 retry traces), and the end-to-end HTTP/1.1 and balancing runs
# against a live steer. legacy/steer is deleted only after this job has
# passed on three consecutive runs on main; the deleting commit names them.
# workflow_dispatch lets a run on main be started without a new commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  steer-difftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: legacy/steer/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configs and routes - diff 10,000 configs and 100,000 requests against steer
        run: make difftest
      - name: Balancers - diff 1,000 scenarios of 10,000 requests against steer
        run: make difftest-balancer
      - name: Resilience - diff 5,000 outlier and 5,000 retry traces against steer
        run: make difftest-resilience
      - name: End to end - HTTP/1.1 and balancing against a live steer
        run: make e2e-steer

  # Every differential suite of the pacer port, weeks 1 to 3: libpacer's
  # algorithms (100 scripts of 10,000 operations, and the million-operation
  # end-to-end test with its replay check), pacerd's config reader (every
  # config in legacy/pacer and 2,000 mutants) and pacerd's data path (the
  # 23 it_*.c scenarios against pacerd and edgefront limits). legacy/pacer
  # is deleted only after this job has passed on main; the deleting pull
  # request links that run.
  difftest-pacer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Algorithms - diff 100 scripts of 10,000 operations against libpacer
        run: make difftest-pacer
      - name: Algorithms - one million operations end to end, with replay
        run: cargo test --release --locked -p edgefront-difftest --test e2e_limiter_port
      - name: Config reader - every pacerd.conf in legacy/pacer and 2,000 mutants
        run: make difftest-pacer-config
      - name: Data path - pacer's 23 integration scenarios against pacerd and edgefront limits
        run: make difftest-l4
