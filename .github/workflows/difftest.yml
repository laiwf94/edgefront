name: difftest

# Every differential suite against steer, as one job: the configuration
# and routing diff (10,000 configs and 100,000 requests), the balancer diff
# (1,000 scenarios of 10,000 picks), the resilience diff (5,000 outlier and
# 5,000 retry traces), and the end-to-end HTTP/1.1 and balancing runs
# against a live steer. legacy/steer was deleted after this job passed on
# three consecutive runs on main, as the deleting commit records; the job
# now builds steer from the last commit that had it (STEER_REV in the
# Makefile), so the port stays held to steer.
# workflow_dispatch lets a run on main be started without a new commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  steer-difftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # steer's source comes from history.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # steer's go.mod at STEER_REV.
          go-version: "1.27.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configs and routes - diff 10,000 configs and 100,000 requests against steer
        run: make difftest
      - name: Balancers - diff 1,000 scenarios of 10,000 requests against steer
        run: make difftest-balancer
      - name: Resilience - diff 5,000 outlier and 5,000 retry traces against steer
        run: make difftest-resilience
      - name: End to end - HTTP/1.1 and balancing against a live steer
        run: make e2e-steer

  # The pacer port against what libpacer and pacerd answered, recorded
  # before legacy/pacer was deleted: algorithms, config reader and the 23
  # data-path scenarios (`make difftest-pacer`).
  difftest-pacer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Algorithms, config reader and data path against libpacer's and pacerd's recorded answers
        run: make difftest-pacer
