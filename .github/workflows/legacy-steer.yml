name: legacy-steer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/steer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: legacy/steer/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/config -run=^$ -fuzz=FuzzParse -fuzztime=20s
          go test ./internal/route -run=^$ -fuzz=FuzzMatch -fuzztime=10s
          go test ./internal/route -run=^$ -fuzz=FuzzCleanPath -fuzztime=10s
          go test ./internal/proxy -run=^$ -fuzz=FuzzClientIP -fuzztime=10s
          go test ./internal/reqid -run=^$ -fuzz=FuzzValid -fuzztime=10s
          go test ./internal/fakeupstream -run=^$ -fuzz=FuzzParseSettings -fuzztime=10s
          go test ./cmd/loadgen -run=^$ -fuzz=FuzzParseHeader -fuzztime=10s
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Diffs edgefront's Rust port against steer until legacy/steer is deleted.
  difftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: legacy/steer/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Diff 10,000 configs and 100,000 requests against steer
        run: make difftest
      - name: Diff 1,000 balancer scenarios of 10,000 requests against steer
        run: make difftest-balancer
      - name: Diff 5,000 outlier and 5,000 retry traces against steer
        run: make difftest-resilience
      - name: End-to-end HTTP/1.1 and balancing against a live steer
        run: make e2e-steer

  # steer's failover drill against both binaries: legacy/steer's own script
  # against steer, and examples/failover.sh against edgefront. Each must
  # succeed 100.00% in all four phases with the resilience features on, and
  # show every fault with them off (scripts/check-failover.sh).
  failover-drill:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: legacy/steer/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drill against steer
        run: |
          legacy/steer/examples/failover.sh | tee "$RUNNER_TEMP/steer.txt"
          scripts/check-failover.sh "$RUNNER_TEMP/steer.txt"
      - name: Drill against edgefront
        run: CHECK=1 examples/failover.sh
