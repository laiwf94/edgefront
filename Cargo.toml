[package]
name = "cachet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "An HTTP caching reverse proxy for the edge."
publish = false

[dependencies]
bytes = "=1.12.1"
hmac = "=0.13.0"
http = "=1.5.0"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio", "server", "server-graceful"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "io-util"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }

[[bench]]
name = "hit_path"
harness = false

[lints]
workspace = true

[workspace]
members = ["crates/edgefront-limiter", "crates/edgefront-proxy"]
# Plain cargo commands at the root (the gate) cover every crate.
default-members = [".", "crates/edgefront-limiter", "crates/edgefront-proxy"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
