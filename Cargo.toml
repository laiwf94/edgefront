# The edgefront workspace. Every crate lives under crates/ and inherits its
# package metadata, dependency pins and lints from here, and the whole
# workspace shares one Cargo.lock.
#
# The root package is cachet as it was before the split. It keeps its
# sources, tests, benchmarks and binary while the W01 cache tasks move them
# into the member crates; once they have all moved, this becomes a virtual
# manifest.

[workspace]
members = ["crates/*"]
# The reference cachet 0.1 checkout that `make difftest-cache` builds under
# target/ is a package of its own, not a member.
exclude = ["target"]
# Plain cargo commands at the root (the gate) cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/laiwf94/edgefront"

[workspace.dependencies]
# Workspace crates.
cachet = { path = ".", version = "0.1.0" }
edgefront-bench = { path = "crates/edgefront-bench", version = "0.1.0" }
edgefront-cache = { path = "crates/edgefront-cache", version = "0.1.0" }
edgefront-core = { path = "crates/edgefront-core", version = "0.1.0" }
edgefront-difftest = { path = "crates/edgefront-difftest", version = "0.1.0" }
edgefront-limiter = { path = "crates/edgefront-limiter", version = "0.1.0" }
edgefront-proxy = { path = "crates/edgefront-proxy", version = "0.1.0" }

# Runtime dependencies, pinned exactly. A crate that needs one names it with
# `workspace = true` and adds features only where it needs more.
bytes = "=1.12.1"
# Compression of cached responses (W07), the reference implementations, behind
# edgefront-cache's `compression` feature: brotli in pure Rust with its custom
# dictionary support for RFC 9842's dcb, flate2 on the pure-Rust miniz_oxide
# backend for gzip, and zstd on the C library for zstd and dcz.
brotli = { version = "=8.0.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.14.4", default-features = false }
# HTTP/2 itself, for what hyper does not expose: why a stream failed
# (refused by GOAWAY or REFUSED_STREAM, so safe to send again) in the
# upstream pool. hyper already depends on it.
h2 = "=0.4.20"
hmac = "=0.13.0"
http = "=1.5.0"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
# Protocol Buffers messages for the decision service's Envoy rate limit
# service API (envoy.service.ratelimit.v3), with the code generated once from
# the vendored .proto files in crates/edgefront-limiter/proto and checked in.
prost = { version = "=0.14.6", default-features = false, features = ["std", "derive"] }
# gRPC for the decision service's Envoy rate limit service API, with no
# features: the limiter uses its request and response framing, status codes
# and codec traits and serves them on edgefront's own listener, so tonic's
# transport, router and codegen stay out of the binary. Tests that need a
# gRPC client or server add `transport` themselves.
tonic = { version = "=0.14.9", default-features = false }
# Async DNS for service discovery (A, AAAA and SRV with their TTLs).
hickory-resolver = "=0.26.3"
hyper = { version = "=1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
# TLS with ring as the one crypto provider: aws-lc-rs, rustls's default,
# needs a C toolchain and CMake, and nothing here needs FIPS.
# ring directly, for what rustls does not expose: key generation and JWS
# signatures for ACME, and OCSP response signatures and SHA-1 CertIDs.
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "io-util", "process"] }

# Development only.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
# DNS messages for the discovery tests' local DNS server; hickory-resolver
# already depends on it.
hickory-proto = "=0.26.3"
# The decision service's code generator, run by a test rather than a build
# script, so no build needs protoc: protox compiles the vendored .proto files
# in Rust and prost-build writes the code the limiter checks in.
prost-build = { version = "=0.14.6", default-features = false, features = ["format"] }
protox = "=0.10.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "cachet"
description = "An HTTP caching reverse proxy for the edge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
edgefront-cache.workspace = true
edgefront-core.workspace = true

bytes.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true
edgefront-proxy.workspace = true

[[bench]]
name = "hit_path"
harness = false

[[bench]]
name = "layer_overhead"
harness = false

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
