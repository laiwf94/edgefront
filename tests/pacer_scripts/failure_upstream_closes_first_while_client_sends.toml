name = "failure_upstream_closes_first_while_client_sends"
from = "it_failures.c"
# The upstream answers 5 bytes and closes without reading; the client
# still gets the 5 bytes and then end of stream.
upstream = [{ name = "u", mode = "source", bytes = 5 }]
config = """
workers 4
drain_timeout 5s
admin_socket {sock}
listener f {
  listen 127.0.0.1:{port}
  upstream {upstream}
}
"""
step = [
  { op = "connect", conn = "a", expect = "ok" },
  { op = "recv_eof", conn = "a", expect = "bytes=5" },
]
