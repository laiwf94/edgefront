name = "failure_connection_churn_keeps_books_balanced"
from = "it_failures.c"
needs_loopback_range = true
# Eight clients open and close connections as fast as they can, a third of
# them with a reset, under per-client limits that refuse some. Afterwards
# every accepted connection is accounted for, none is open and no hold is
# left in the client table.
upstream = [{ name = "u", mode = "echo" }]
config = """
workers 4
drain_timeout 5s
admin_socket {sock}
listener f {
  listen 127.0.0.1:{port}
  upstream {upstream}
  per_ip_max_conns 2
  per_ip_conn_rate 200/s burst 50
}
"""
step = [
  { op = "churn", count = 150, sources = ["127.0.1.1", "127.0.1.2", "127.0.1.3", "127.0.1.4", "127.0.1.1", "127.0.1.2", "127.0.1.3", "127.0.1.4"], expect = "yes" },
  { op = "stats", counters = ["open", "balanced", "refused>0", "accepted+refused"], expect = "open=0 closed=accepted:yes refused>0:yes accepted+refused=1200" },
  { op = "signal", text = "TERM", expect = "yes" },
  { op = "exit", expect = "exit 0" },
  { op = "no_log", text = "client table lost a hold", expect = "absent" },
]
