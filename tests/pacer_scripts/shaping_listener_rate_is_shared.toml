name = "shaping_listener_rate_is_shared"
from = "it_shaping.c"
# Two clients, 1 MiB each, through a listener capped at 1 MiB/s: together
# they take about 2 s, and neither gets the whole link. (The C test used
# two source addresses; only the listener's limit is set, so one address
# is the same test and runs on any host.)
upstream = [{ name = "u", mode = "source", bytes = 1048576 }]
config = """
workers 2
listener shape {
  listen 127.0.0.1:{port}
  upstream {upstream}
  bandwidth 1m/s burst 32k
}
"""
step = [
  { op = "download_bg", conn = "a", bytes = 1048576 },
  { op = "download_bg", conn = "b", bytes = 1048576 },
  { op = "together", sources = ["a", "b"], min_ms = 1800, max_ms = 2600, count = 1200, expect = "bytes=1048576 hash=ok, bytes=1048576 hash=ok slowest time=ok fastest ok" },
]
